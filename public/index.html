<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <title>L</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor" id="cursor-dot"></div>
  <div class="cursor" id="cursor-ring"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- ================= AUTH VIEW ================= -->
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-head">
        <div class="brand-mark">L</div>
        <div>
          <h1>L</h1>
          <p>Lookups against public data. Nothing stored beyond your account.</p>
        </div>
      </div>

      <div class="auth-toggle">
        <button id="tab-login" class="active">Sign in</button>
        <button id="tab-register">Create account</button>
      </div>

      <form id="form-login" class="aform">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
        <div class="form-msg"></div>
      </form>

      <form id="form-register" class="aform hidden">
        <div class="field">
          <label for="reg-email">Email</label>
          <div class="row">
            <input type="email" id="reg-email" autocomplete="off" required />
            <button type="button" id="btn-send-code" class="btn-ghost">Send code</button>
          </div>
        </div>
        <div class="field">
          <label for="reg-code">Verification code</label>
          <input type="text" id="reg-code" inputmode="numeric" maxlength="6" placeholder="000000" disabled />
        </div>
        <div class="field">
          <label for="reg-pass">Password <span class="hint">min 8 characters</span></label>
          <input type="password" id="reg-pass" minlength="8" autocomplete="new-password" disabled />
        </div>
        <div class="field">
          <label for="reg-pass2">Confirm password</label>
          <input type="password" id="reg-pass2" minlength="8" autocomplete="new-password" disabled />
        </div>
        <button type="submit" id="btn-register" class="btn-primary" disabled>Create account</button>
        <div class="form-msg"></div>
      </form>
    </div>
  </div>

  <!-- ================= APP VIEW ================= -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div class="brand-text"><span class="name">L</span><span class="sub">toolkit</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="user">
        <div class="avatar" id="user-avatar">?</div>
        <div class="meta">
          <div id="user-email" class="uem"></div>
          <button id="btn-logout" class="link-btn">Log out</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <div class="crumbs">
          <span class="c-home">L</span>
          <span class="c-sep">/</span>
          <span class="c-here" id="page-title">Email lookup</span>
        </div>
        <div class="status" id="page-status">
          <span class="dot"></span>
          <span id="status-text">ready</span>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="toasts"></div>
  <script src="directory.js"></script>
  <script src="app.js"></script>
</body>
</html>
